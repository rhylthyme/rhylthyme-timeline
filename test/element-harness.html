<meta charset="utf-8">
<title>rhylthyme-timeline element harness</title>
<rhylthyme-timeline id="el" mode="player" speed="1"></rhylthyme-timeline>
<pre id="results"></pre>
<script src="../src/index.js"></script>
<script>
// Properties set before element.js defines the element (a deferred or lazy
// script): they land as own properties of plain elements and must still go
// through the element's setters once it upgrades.
window.PRE_UPGRADE = (function () {
  const make = (attrs) => {
    const e = document.createElement('rhylthyme-timeline');
    Object.keys(attrs).forEach((k) => e.setAttribute(k, attrs[k]));
    return e;
  };
  // Attached: upgrades when the element is defined. Attribute first, then
  // property: the property's labels must be the ones shown and reported.
  const attached = make({ labels: '{"stop":"AttrStop"}', mode: 'player' });
  attached.labels = { stop: 'PropStop', resume: (x) => 'Weiter' + (x === undefined ? '' : x) };
  attached.mode = 'static';
  attached.style.display = 'none';
  document.documentElement.appendChild(attached);
  // Detached: upgraded by hand with customElements.upgrade.
  const detached = make({ labels: '{"stop":"AttrStop"}' });
  detached.labels = { stop: 'PropStop' };
  // Property only, no attribute.
  const propOnly = make({});
  propOnly.labels = { start: 'Los' };
  return { attached, detached, propOnly };
})();
</script>

<script>
// Drives the element with a fake clock and records what a test can assert on.
// Async only to let microtasks run (a removed element drops its run one
// microtask after disconnect); every await is on an already-settled promise,
// so the results are written before the load event and the DOM dump.
(async function () {
  const microtask = () => new Promise((resolve) => queueMicrotask(resolve));
  const out = { checks: {}, events: [], errors: [] };
  try {
    const el = document.getElementById('el');
    let ms = 0;
    el.setClock(() => ms);
    for (const ev of ['rt-start', 'rt-pause', 'rt-stop', 'rt-step-start', 'rt-step-complete', 'rt-complete']) {
      el.addEventListener(ev, (e) => out.events.push([ev, e.detail.stepId || null, Math.round(e.detail.time || 0)]));
    }
    // Run records (runs schema 0.1.0-alpha): one per run, on completion, on
    // stop() and when a run is dropped (program replaced / element removed).
    out.records = {};
    const mainRecords = [];
    el.addEventListener('rt-run-record', (e) => mainRecords.push(e.detail));
    const advance = (sec) => { ms += sec * 1000; el.tick(); };
    const shadowText = () => el.shadowRoot.textContent;
    const bars = () => el.shadowRoot.querySelectorAll('rect.rt-bar').length;

    el.program = JSON.parse(JSON.stringify(window.RHYLTHYME_EXAMPLES.thanksgiving_one_oven));
    out.checks.rendersBars = bars();
    out.checks.hasControls = !!el.shadowRoot.querySelector('.controls button[data-act="start"]');
    out.checks.hasCursorBeforeStart = !!el.shadowRoot.querySelector('.rt-cursor');

    el.start();
    out.checks.statusRunning = el.status;
    advance(1300); // roast (indefinite, automatic start at 1200) is active
    out.checks.roastState = el.stepStates['turkey-roast'];
    out.checks.roastDoneButton = !!el.shadowRoot.querySelector('button[data-step-done="turkey-roast"]');
    out.checks.timeDisplay = el.shadowRoot.querySelector('.time').textContent;

    advance(7200); // t = 8500: potatoes-peel is planned at 8400 (roast end − 45 min) and needs a start
    out.checks.peelState = el.stepStates['potatoes-peel'];
    out.checks.peelStartButton = !!el.shadowRoot.querySelector('button[data-step-start="potatoes-peel"]');
    advance(500); // t = 9000: still waiting, floats forward
    out.checks.peelFloatsTo = Math.round(el.timings['potatoes-peel'].start);
    el.startStep('potatoes-peel'); // caps the roast at 9000 + 2700 = 11700
    out.checks.peelStateAfterStart = el.stepStates['potatoes-peel'];
    advance(2800); // t = 11800: roast auto-completed at the cap
    out.checks.roastEnd = Math.round(el.timings['turkey-roast'].end);
    out.checks.roastState2 = el.stepStates['turkey-roast'];
    out.checks.restStart = Math.round(el.timings['turkey-rest'].start);

    // Drive to the end: start every manual gate as it becomes ready, finish indefinite steps.
    let guard = 0;
    while (el.status === 'running' && guard++ < 200) {
      advance(120);
      const states = el.stepStates;
      for (const id of Object.keys(states)) {
        if (states[id] === 'waiting') el.startStep(id);
      }
    }
    out.checks.finalStatus = el.status;
    out.checks.finalTime = Math.round(el.currentTime);
    out.checks.allDone = Object.values(el.stepStates).every((s) => s === 'done');

    // Speed and stop
    el.stop();
    out.checks.afterStop = [el.status, el.currentTime, Object.keys(el.stepStates).filter((k) => el.stepStates[k] !== 'pending').length];
    el.setAttribute('speed', '10');
    el.start(); advance(10);
    out.checks.speed10Time = Math.round(el.currentTime);
    el.pause();
    out.checks.pausedStatus = el.status;

    // Static mode: no controls, no cursor
    el.setAttribute('mode', 'static');
    out.checks.staticControls = !!el.shadowRoot.querySelector('.controls');
    out.checks.staticCursor = !!el.shadowRoot.querySelector('.rt-cursor');
    out.checks.staticBars = bars();

    // Time formats
    el.setAttribute('mode', 'player');
    el.setAttribute('time-format', 'hours');
    out.checks.hoursFormat = el.formatTime(3725);
    el.setAttribute('time-format', 'clock');
    el.setAttribute('start-at', '2026-11-26T14:00:00');
    out.checks.clockFormat = el.formatTime(600);

    // ---- replicate instances: grouping and actual-completion re-anchoring
    // Three trays, one oven, a rack that holds two (maxInFlight: 2).
    el.removeAttribute('start-at');
    el.setAttribute('time-format', 'minutes');
    el.setAttribute('speed', '1');
    el.program = JSON.parse(JSON.stringify(window.RHYLTHYME_COOKIES));
    out.checks.cookieGroups = el.groups.map((g) => [g.instanceOf, g.name, g.count, g.done, g.running]);
    el.start();
    advance(2400); // bake-r1 and cool-r1 have run; bake-r3 is still projected
    out.checks.bakeR3Planned = Math.round(el.timings['bake-r3'].start);
    out.checks.groupsMidRun = el.groups.map((g) => [g.instanceOf, g.done, g.running, g.pending]);
    advance(300); // t = 2700: tray 1 comes off the rack three minutes late
    el.completeStep('cool-r1');
    out.checks.coolR1ActualEnd = Math.round(el.timings['cool-r1'].end);
    out.checks.bakeR3Reanchored = Math.round(el.timings['bake-r3'].start);
    out.checks.coolR3Reanchored = Math.round(el.timings['cool-r3'].start);
    out.checks.boxReanchored = Math.round(el.timings['box'].start);
    el.stop();

    // ---- run records --------------------------------------------------
    // The main element produced three runs above: the Thanksgiving run it
    // played to completion, the 10x run abandoned when the program was
    // replaced, and the cookies run stopped mid-flight.
    out.records.mainOutcomes = mainRecords.map((r) => r.outcome);
    out.records.mainFirst = mainRecords[0] ? mainRecords[0].record : null;

    // A dedicated element with separate monotonic and wall clocks: prep is a
    // fixed step that ends on its timer, simmer is indefinite and waits for
    // the executor.
    const RUNREC = {
      schemaVersion: '0.2.0-alpha',
      programId: 'runrec-demo',
      name: 'Run record demo',
      environmentType: 'kitchen',
      tracks: [{ trackId: 'pot', name: 'Pot', steps: [
        { stepId: 'prep', name: 'Prep', task: 'cook', duration: { type: 'fixed', seconds: 60 }, startTrigger: { type: 'programStart' } },
        { stepId: 'simmer', name: 'Simmer', task: 'cook', duration: { type: 'indefinite', defaultSeconds: 120 }, startTrigger: { type: 'afterStep', stepId: 'prep' } }
      ] }],
      resourceConstraints: [{ task: 'cook', maxConcurrent: 1 }],
      metadata: { serves: '2', userTags: { oven: 'gas' } }
    };
    const makeEl = (program, speed) => {
      const e = document.createElement('rhylthyme-timeline');
      e.setAttribute('mode', 'player');
      e.setAttribute('speed', String(speed || 1));
      document.body.appendChild(e);
      e.program = JSON.parse(JSON.stringify(program));
      return e;
    };

    // (a) completed, with a tab-hide gap attributed to the running step
    let m2 = 0, w2 = Date.UTC(2026, 8, 14, 12, 0, 0);
    const el2 = makeEl(RUNREC);
    const rec2 = [];
    el2.addEventListener('rt-run-record', (e) => rec2.push(e.detail));
    el2.setClock(() => m2, () => w2);
    const adv2 = (sec) => { m2 += sec * 1000; w2 += sec * 1000; el2.tick(); };
    el2.start();
    adv2(30);
    w2 += 10000; // ten seconds of wall time with the monotonic clock asleep
    document.dispatchEvent(new Event('visibilitychange'));
    out.checks.pauseAttributed = el2.runRecord.steps.map((s) => [s.stepId, s.pausedSeconds]);
    out.checks.liveSnapshotOutcome = el2.runRecord.outcome;
    adv2(40);  // t = 70: prep ended on its timer at 60, simmer is running
    adv2(90);  // t = 160
    el2.completeStep('simmer');
    adv2(5);   // completion is confirmed three seconds later
    out.records.completedOutcomes = rec2.map((r) => r.outcome);
    out.records.completed = rec2[0] ? rec2[0].record : null;
    out.checks.runRecordGetterMatches = !!(rec2[0] && el2.runRecord && el2.runRecord.runId === rec2[0].record.runId);
    el2.stop();    // the run is already recorded: no second record
    el2.remove();  // nor on disconnect
    await microtask();
    out.checks.recordsAfterStopAndRemove = rec2.length;

    // (b) stop() mid-run at speed 10 -> aborted
    let m3 = 0, w3 = Date.UTC(2026, 8, 14, 13, 0, 0);
    const el3 = makeEl(RUNREC, 10);
    const rec3 = [];
    el3.addEventListener('rt-run-record', (e) => rec3.push(e.detail));
    el3.setClock(() => m3, () => w3);
    el3.start();
    m3 += 3000; w3 += 3000; el3.tick();  // 3 s of wall time = 30 s of program time
    el3.stop();
    out.records.aborted = rec3[0] ? rec3[0].record : null;
    el3.remove();

    // (c) removed from the DOM mid-run -> abandoned
    let m4 = 0, w4 = Date.UTC(2026, 8, 14, 14, 0, 0);
    const el4 = makeEl(RUNREC);
    const rec4 = [];
    el4.addEventListener('rt-run-record', (e) => rec4.push(e.detail));
    el4.setClock(() => m4, () => w4);
    el4.start();
    m4 += 30000; w4 += 30000; el4.tick();
    el4.remove();
    out.records.abandonedSync = rec4.length; // decided a microtask later
    await microtask();
    out.records.abandoned = rec4[0] ? rec4[0].record : null;

    // ---- declared variance factors (Phase 4) ---------------------------
    // The Thanksgiving example as the catalog declares it: two factors, one
    // number with a unit and one enum. The prompt is a pre-flight in the
    // shadow DOM: start() opens it instead of starting, and its Start button
    // starts the run with the answers, which land in context.userTags.
    const FACTORS = [
      { key: 'turkeyKg', label: 'Turkey weight (kg)', type: 'number', unit: 'kg' },
      { key: 'oven', label: 'Oven type', type: 'enum', values: ['gas', 'electric', 'convection'] },
    ];
    const withFactors = () => {
      const p = JSON.parse(JSON.stringify(window.RHYLTHYME_EXAMPLES.thanksgiving_one_oven));
      p.metadata = p.metadata || {};
      p.metadata.varianceFactors = JSON.parse(JSON.stringify(FACTORS));
      return p;
    };
    const factorForm = (e) => e.shadowRoot.querySelector('.factors:not([hidden])');
    const factorFields = (e) => Array.prototype.map.call(
      e.shadowRoot.querySelectorAll('.factors [data-factor]'),
      (f) => [f.getAttribute('data-factor'), f.tagName.toLowerCase(), f.type || '']
    );
    out.factors = {};

    // (i) the form renders one field per declared factor and start() defers
    const f1 = makeEl(withFactors());
    const fEvents1 = [];
    f1.addEventListener('rt-factors', (e) => fEvents1.push(e.detail));
    out.factors.declared = f1.declaredFactors.map((f) => [f.key, f.type, f.unit || null, f.values || null]);
    out.factors.formBeforeStart = !!factorForm(f1);
    f1.start();
    out.factors.statusAfterStart = f1.status;          // still stopped: the form is up
    out.factors.formAfterStart = !!factorForm(f1);
    out.factors.fields = factorFields(f1);
    out.factors.unitShown = f1.shadowRoot.querySelector('.factors .unit').textContent;
    out.factors.enumOptions = Array.prototype.map.call(
      f1.shadowRoot.querySelectorAll('.factors select[data-factor="oven"] option'), (o) => o.value
    );
    // Answer both and press the form's Start button.
    f1.shadowRoot.querySelector('.factors [data-factor="turkeyKg"]').value = '6.4';
    f1.shadowRoot.querySelector('.factors select[data-factor="oven"]').value = 'convection';
    f1.shadowRoot.querySelector('.factors button[data-act="factors-start"]').click();
    out.factors.statusAfterSubmit = f1.status;
    out.factors.formAfterSubmit = !!factorForm(f1);
    out.factors.answered = f1.factors;
    out.factors.events = fEvents1.map((d) => [d.source, d.factors, d.skipped]);
    out.factors.recordTags = f1.runRecord.context.userTags;
    f1.remove();

    // (ii) every field is skippable: Start with nothing filled in
    const f2 = makeEl(withFactors());
    f2.start();
    f2.shadowRoot.querySelector('.factors button[data-act="factors-start"]').click();
    out.factors.skippedStatus = f2.status;
    out.factors.skippedTags = f2.runRecord.context.userTags;
    f2.remove();

    // (iii) a bad answer typed into the form is refused and the run does not start
    const f3 = makeEl(withFactors());
    f3.start();
    f3.shadowRoot.querySelector('.factors [data-factor="turkeyKg"]').value = 'heavy';
    f3.shadowRoot.querySelector('.factors button[data-act="factors-start"]').click();
    out.factors.badStatus = f3.status;
    out.factors.badError = f3.shadowRoot.querySelector('.factors [data-factor-error="turkeyKg"]:not([hidden])').textContent;
    out.factors.badStillOpen = !!factorForm(f3);
    // ...fix it and the run starts
    f3.shadowRoot.querySelector('.factors [data-factor="turkeyKg"]').value = '7';
    f3.shadowRoot.querySelector('.factors button[data-act="factors-start"]').click();
    out.factors.fixedStatus = f3.status;
    out.factors.fixedTags = f3.runRecord.context.userTags;
    f3.remove();

    // (iv) presetting every factor (property or data-factors) skips the form;
    //      bad and undeclared values are dropped, exactly as the CLI does
    const f4 = makeEl(withFactors());
    const fEvents4 = [];
    f4.addEventListener('rt-factors', (e) => fEvents4.push(e.detail));
    f4.factors = { turkeyKg: '5.5', oven: 'GAS', sampleCount: 3 };
    out.factors.preset = f4.factors;
    out.factors.presetEvent = fEvents4.map((d) => [d.source, d.skipped]);
    f4.start();
    out.factors.presetStatus = f4.status;              // straight into the run
    out.factors.presetFormShown = !!factorForm(f4);
    out.factors.presetTags = f4.runRecord.context.userTags;
    f4.stop();
    // A bad enum is refused by the setter, which then leaves the factor unanswered.
    f4.factors = { turkeyKg: 6, oven: 'induction' };
    out.factors.badEnumDropped = f4.factors;
    out.factors.badEnumSkipped = fEvents4[fEvents4.length - 1].skipped;
    out.factors.reopensWhenIncomplete = (f4.start(), f4.status);
    f4.remove();

    const f5 = makeEl(withFactors());
    f5.setAttribute('data-factors', 'turkeyKg=4.2,oven=electric');
    out.factors.fromAttribute = f5.factors;
    f5.start();
    out.factors.attributeStatus = f5.status;
    f5.remove();
    const f6 = makeEl(withFactors());
    f6.setAttribute('data-factors', '{"turkeyKg": 8, "oven": "gas"}');
    out.factors.fromJsonAttribute = f6.factors;
    f6.remove();

    // (v) a program that declares no factors is untouched: no form, no prompt
    const f7 = makeEl(RUNREC);
    out.factors.undeclared = f7.declaredFactors;
    out.factors.undeclaredAsk = f7.askFactors();
    f7.start();
    out.factors.undeclaredStatus = f7.status;
    out.factors.undeclaredForm = !!factorForm(f7);
    f7.remove();

    // ---- predicted offsets (Phase 7) -----------------------------------
    // metadata.offsetsUse: "predicted" lets a NEGATIVE offset be resolved
    // against a PREDICTED anchor end instead of the anchor's defaultSeconds.
    // Thanksgiving: turkey-prep is fixed 1200 s, turkey-roast is indefinite
    // with defaultSeconds 9900, and potatoes-peel hangs off the roast at
    // -2700 s, so the plan puts the peel at 1200 + 9900 - 2700 = 8400.
    const PREDICTED_ROAST = { seconds: 7200, low: 6900, high: 7500, basis: 'model', n: 20 };
    const withOffsets = (use, extra) => {
      const p = JSON.parse(JSON.stringify(window.RHYLTHYME_EXAMPLES.thanksgiving_one_oven));
      p.metadata = p.metadata || {};
      if (use) p.metadata.offsetsUse = use;
      if (extra) Object.keys(extra).forEach((k) => { p.metadata[k] = extra[k]; });
      return p;
    };
    const peelStart = (e) => Math.round(e.timings['potatoes-peel'].start);
    out.predicted = {};

    // (i) no flag: the prediction is ignored entirely
    const q1 = makeEl(withOffsets(null));
    q1.predictions = { 'turkey-roast': PREDICTED_ROAST };
    out.predicted.plannedOffsetsUse = q1.offsetsUse;
    out.predicted.plannedPeelStart = peelStart(q1);
    out.predicted.plannedAnchors = q1.predictedAnchors;
    q1.remove();

    // (ii) flag set: the peel moves to predicted-end - 45 min
    //      = 1200 + 7200 - 2700 = 5700
    const q2 = makeEl(withOffsets('predicted'));
    out.predicted.beforePredictions = peelStart(q2);
    q2.predictions = { 'turkey-roast': PREDICTED_ROAST };
    out.predicted.offsetsUse = q2.offsetsUse;
    out.predicted.peelStart = peelStart(q2);
    out.predicted.anchors = q2.predictedAnchors;
    out.predicted.roundTrip = q2.predictions;
    // The roast's own projection moved too, but the plan did not: the record's
    // frozen `planned` still comes from the program as authored.
    out.predicted.roastEnd = Math.round(q2.timings['turkey-roast'].end);
    q2.start();
    out.predicted.recordOffsetsUse = q2.runRecord.context.offsetsUse;
    out.predicted.recordPeel = q2.runRecord.steps
      .filter((s) => s.stepId === 'potatoes-peel')
      .map((s) => [s.predictedAnchorSeconds, s.planned.start, s.planned.end]);
    out.predicted.recordRoastPlanned = q2.runRecord.steps
      .filter((s) => s.stepId === 'turkey-roast')
      .map((s) => [s.planned.end, s.planned.defaultSeconds]);
    out.records.predicted = q2.runRecord;
    // Clearing the predictions puts the peel back on the plan.
    q2.predictions = {};
    out.predicted.clearedPeelStart = peelStart(q2);
    q2.stop();
    q2.remove();

    // (iii) an interval as wide as the guess is history saying it does not
    //       know: high - low must be STRICTLY narrower than defaultSeconds
    const q3 = makeEl(withOffsets('predicted'));
    q3.predictions = { 'turkey-roast': { seconds: 7200, low: 0, high: 9900, basis: 'model' } };
    out.predicted.wideIntervalPeel = peelStart(q3);
    q3.predictions = { 'turkey-roast': { seconds: 7200, low: 0, high: 9899, basis: 'model' } };
    out.predicted.narrowEnoughPeel = peelStart(q3);
    // basis "none" is the predictor declining to answer
    q3.predictions = { 'turkey-roast': { seconds: 7200, low: 6900, high: 7500, basis: 'none' } };
    out.predicted.basisNonePeel = peelStart(q3);
    // ...and a prediction for a step nothing hangs off changes nothing
    q3.predictions = { 'potatoes-boil': PREDICTED_ROAST };
    out.predicted.irrelevantPeel = peelStart(q3);
    q3.remove();

    // (iv) the attribute takes the same JSON
    const q4 = makeEl(withOffsets('predicted'));
    q4.setAttribute('data-predictions', JSON.stringify({ 'turkey-roast': PREDICTED_ROAST }));
    out.predicted.fromAttribute = peelStart(q4);
    q4.setAttribute('data-predictions', 'not json');
    out.predicted.badAttribute = [q4.predictions, peelStart(q4)];
    q4.remove();

    // ---- rt-step-began / rt-step-ended (issue #6) ----------------------
    // One event per step start and end, whatever caused it, at the second
    // of the transition rather than the tick that found it.
    out.transitions = {};
    const watch = (e) => {
      const log = [];
      for (const ev of ['rt-step-began', 'rt-step-ended', 'rt-step-start', 'rt-step-complete', 'rt-start', 'rt-stop', 'rt-complete']) {
        e.addEventListener(ev, (x) => log.push([ev, x.detail.stepId || null, x.detail.time === undefined ? null : x.detail.time, x.detail.by || null]));
      }
      return log;
    };
    const onlySteps = (log) => log.filter((x) => x[0] === 'rt-step-began' || x[0] === 'rt-step-ended');

    // (i) Thanksgiving to the end, in 120 s ticks so one tick finds several
    //     transitions; then replay it (stop + start is a fresh run).
    let mT = 0;
    const t1 = makeEl(window.RHYLTHYME_EXAMPLES.thanksgiving_one_oven);
    t1.setClock(() => mT);
    const logT = watch(t1);
    const advT = (sec) => { mT += sec * 1000; t1.tick(); };
    const driveT = () => {
      let g = 0;
      while (t1.status === 'running' && g++ < 300) {
        advT(120);
        const st = t1.stepStates;
        for (const id of Object.keys(st)) if (st[id] === 'waiting') t1.startStep(id);
      }
    };
    out.transitions.stepIds = Object.keys(t1.stepStates);
    t1.start();
    out.transitions.firstAfterStart = onlySteps(logT).slice();
    driveT();
    out.transitions.status = t1.status;
    out.transitions.full = logT.slice();
    logT.length = 0;
    t1.stop();
    out.transitions.afterCompletedStop = onlySteps(logT).length;
    t1.start();
    advT(1300);      // turkey-prep has ended, the roast is running
    t1.stop();       // the roast ends "abort"
    out.transitions.replay = logT.slice();
    t1.remove();

    // (ii) replicate instances: one big tick runs the whole cookie program
    let mC = 0;
    const c1 = makeEl(window.RHYLTHYME_COOKIES);
    c1.setClock(() => mC);
    const logC = watch(c1);
    c1.start();
    mC += 5000 * 1000; c1.tick();
    out.transitions.cookies = onlySteps(logC);
    out.transitions.cookiesStatus = c1.status;
    c1.remove();

    // (iii) a person finishes an indefinite step: by "person"
    let mR = 0;
    const r1 = makeEl(RUNREC);
    r1.setClock(() => mR);
    const logR = watch(r1);
    r1.start();
    mR += 100000; r1.tick();
    r1.completeStep('simmer');
    mR += 5000; r1.tick();
    out.transitions.person = onlySteps(logR);
    r1.remove();

    // (iv) seek: forward fires what it passes, backward fires nothing,
    //      nothing fires twice
    const s1 = makeEl(window.RHYLTHYME_COOKIES);
    const logS = watch(s1);
    s1.seek(1000);
    out.transitions.seekForward = onlySteps(logS).slice();
    logS.length = 0;
    s1.seek(100);
    out.transitions.seekBack = onlySteps(logS).slice();
    s1.seek(2000);
    out.transitions.seekOn = onlySteps(logS).slice();
    s1.remove();

    // (v) zero-length steps: each ends right after its own begin, before the
    //     begins that wait on it, even when the waiting step's track comes first.
    const tprog = (tracks) => ({
      schemaVersion: '0.2.0-alpha', programId: 'zero', name: 'zero', environmentType: 'kitchen',
      tracks: tracks.map((steps, i) => ({ trackId: 't' + i, name: 't' + i, steps: steps })),
      resourceConstraints: [{ task: 'x', maxConcurrent: 5 }],
    });
    const fx = (id, sec, trig) => ({ stepId: id, name: id, task: 'x', duration: { type: 'fixed', seconds: sec }, startTrigger: trig || { type: 'programStart' } });
    let mZ = 0;
    const z1 = makeEl(tprog([
      [fx('B', 10, { type: 'afterStep', stepId: 'Z2' })],
      [fx('A', 10), fx('Z1', 0, { type: 'afterStep', stepId: 'A' }), fx('Z2', 0, { type: 'afterStep', stepId: 'Z1' })],
    ]));
    z1.setClock(() => mZ);
    const logZ = watch(z1);
    z1.start();
    mZ += 30000; z1.tick();
    out.transitions.zeroLength = onlySteps(logZ);
    z1.remove();

    // (vi) a handler that calls back into the element: stop() from an
    //      rt-step-ended handler sees the rest of the batch out before its
    //      abort ends and rt-stop, and nothing fires after rt-stop;
    //      completeStep() from a handler keeps the time order.
    let mH = 0;
    const h1 = makeEl(tprog([[fx('A', 10), fx('B', 10, { type: 'afterStep', stepId: 'A' }), fx('C', 10, { type: 'afterStep', stepId: 'B' })]]));
    h1.setClock(() => mH);
    const logH = watch(h1);
    let stopped = false;
    h1.addEventListener('rt-step-ended', (x) => { if (!stopped && x.detail.stepId === 'A') { stopped = true; h1.stop(); } });
    h1.start();
    mH += 25000; h1.tick();
    out.transitions.stopInHandler = logH.slice();
    out.transitions.stopInHandlerStatus = h1.status;
    h1.remove();

    let mK = 0;
    const k1 = makeEl(tprog([
      [fx('A', 10), { stepId: 'V', name: 'V', task: 'x', duration: { type: 'indefinite', defaultSeconds: 100 }, startTrigger: { type: 'afterStep', stepId: 'A' } }],
      [fx('P', 5), fx('Q', 20, { type: 'afterStep', stepId: 'P' })],
    ]));
    k1.setClock(() => mK);
    const logK = watch(k1);
    k1.addEventListener('rt-step-began', (x) => { if (x.detail.stepId === 'V') k1.completeStep('V'); });
    k1.start();
    mK += 40000; k1.tick();
    out.transitions.completeInHandler = onlySteps(logK);
    k1.remove();

    // (viii) startStep() on a stopped player starts a run first, so the
    //        step begins on a moving clock and fires rt-step-began.
    let mG = 0;
    const g1 = makeEl(tprog([[{ stepId: 'G', name: 'G', task: 'x', duration: { type: 'fixed', seconds: 10 }, startTrigger: { type: 'manual' } }]]));
    g1.setClock(() => mG);
    const logG = watch(g1);
    out.transitions.startStepStopped = [g1.startStep('G'), g1.status];
    mG += 20000; g1.tick();
    out.transitions.startStepStoppedLog = logG.filter((x) => x[0] !== 'rt-tick');
    g1.remove();

    // (vii) delivery policies: dropped runs, rt-seek, stop() from a handler.
    const P3 = out.policies = {};
    const watchAll = (e) => {
      const log = [];
      for (const ev of ['rt-step-began', 'rt-step-ended', 'rt-start', 'rt-stop', 'rt-complete', 'rt-load', 'rt-run-record', 'rt-seek', 'rt-tick']) {
        e.addEventListener(ev, (x) => {
          const d = x.detail;
          if (ev === 'rt-run-record') log.push([ev, d.outcome]);
          else if (ev === 'rt-seek') log.push([ev, d.from, d.to]);
          else if (ev === 'rt-load' || ev === 'rt-stop') log.push([ev]);
          else if (ev === 'rt-tick' || ev === 'rt-start' || ev === 'rt-complete') log.push([ev, d.time]);
          else log.push([ev, d.stepId, d.time, d.by]);
        });
      }
      return log;
    };
    const noTicks = (log) => log.filter((x) => x[0] !== 'rt-tick');
    // A runs 0-100 on its own track; B 0-50 then C 50-150 on another.
    const DROP = tprog([[fx('A', 100)], [fx('B', 50), fx('C', 100, { type: 'afterStep', stepId: 'B' })]]);
    const OTHER = tprog([[fx('X', 10)]]);
    const recordSteps = (r) => r.steps.map((x) => [x.stepId, x.actual || null, x.endedBy || null]);

    P3.replacedRecord = recD1 ? [recD1.outcome, recordSteps(recD1)] : null;
    mD += 500000; d1.tick();
    P3.afterReplaced = logD1.slice(P3.replaced.length);
    d1.remove();

    //     the rest of the batch first, then the dropped ends, no rt-tick.
    let mD2 = 0;
    const d2 = makeEl(tprog([[fx('A', 10), fx('B', 10, { type: 'afterStep', stepId: 'A' }), fx('C', 10, { type: 'afterStep', stepId: 'B' })]]));
    d2.setClock(() => mD2);
    const logD2 = watchAll(d2);
    let swapped = false;
    d2.addEventListener('rt-step-ended', (x) => { if (!swapped && x.detail.stepId === 'A') { swapped = true; d2.program = JSON.parse(JSON.stringify(OTHER)); } });
    d2.start();
    mD2 += 25000; d2.tick();
    P3.replacedInHandler = logD2.slice();
    d2.remove();

    //     dropped ends and the record a microtask later; put back, it stays still.
    let mD3 = 0;
    const d3 = makeEl(DROP);
    d3.setClock(() => mD3);
    const logD3 = watchAll(d3);
    d3.start();
    mD3 += 60000; d3.tick();
    logD3.length = 0;
    d3.remove();
    P3.removedSync = logD3.slice();
    await microtask();
    P3.removed = logD3.slice();
    document.body.appendChild(d3);
    mD3 += 500000; d3.tick();
    document.dispatchEvent(new Event('visibilitychange'));
    P3.afterRemoved = logD3.slice(P3.removed.length);
    P3.afterRemovedStatus = d3.status;
    d3.stop();
    P3.afterRemovedStop = logD3.slice(P3.removed.length + P3.afterRemoved.length);
    d3.remove();

    // (d) moved: appendChild to another parent, and remove() + re-insert in
    //     one script. The run goes on, nothing is dropped, the clock resumes.
    let mD4 = 0;
    const d4 = makeEl(DROP);
    d4.setClock(() => mD4);
    const logD4 = watchAll(d4);
    d4.start();
    mD4 += 60000; d4.tick();
    logD4.length = 0;
    const host2 = document.createElement('div');
    document.body.appendChild(host2);
    host2.appendChild(d4);
    await microtask();
    d4.remove();
    document.body.appendChild(d4);
    await microtask();
    P3.moved = logD4.slice();
    P3.movedStatus = d4.status;
    P3.movedTimer = d4._timer !== null;
    mD4 += 100000; d4.tick();
    mD4 += 5000; d4.tick();  // completion is confirmed three seconds later
    P3.movedRunOn = noTicks(logD4);
    P3.movedRecord = d4.runRecord ? d4.runRecord.outcome : null;
    d4.stop();
    host2.remove();
    d4.remove();

    // (f) stop() from a handler, with every event logged: the rest of the
    //     batch, the abort end, rt-stop, then nothing (no rt-tick either).
    let mD5 = 0;
    const d5 = makeEl(tprog([[fx('A', 10), fx('B', 10, { type: 'afterStep', stepId: 'A' }), fx('C', 10, { type: 'afterStep', stepId: 'B' })]]));
    d5.setClock(() => mD5);
    const logD5 = watchAll(d5);
    let stopped5 = false;
    d5.addEventListener('rt-step-ended', (x) => { if (!stopped5 && x.detail.stepId === 'A') { stopped5 = true; d5.stop(); } });
    d5.start();
    mD5 += 25000; d5.tick();
    P3.stopInHandler = logD5.slice();
    d5.remove();

    // (e) seek: rt-seek after the step events it causes; backward and no-op.
    const s2 = makeEl(window.RHYLTHYME_COOKIES);
    const logS2 = watchAll(s2);
    s2.seek(0);
    P3.seekNoopAtZero = logS2.slice();
    s2.seek(1000);
    P3.seekForward = logS2.slice();
    logS2.length = 0;
    s2.seek(100);
    P3.seekBack = logS2.slice();
    logS2.length = 0;
    s2.seek(100);
    P3.seekSame = logS2.slice();
    s2.seek(2000);
    P3.seekOn = logS2.slice();
    logS2.length = 0;
    s2.start();
    s2.seek(3000);
    P3.seekWhileRunning = noTicks(logS2).filter((x) => x[0] === 'rt-seek');
    s2.stop();
    s2.remove();

    // (g) an idle element has no run to drop: removed for good (never
    //     started; stopped after a run; program replaced while detached),
    //     put back, started, it runs normally.
    const idleCase = async (prep) => {
      let mI = 0;
      const e = makeEl(DROP);
      e.setClock(() => mI);
      const log = watchAll(e);
      await prep(e, () => { mI += 10000; e.tick(); });
      log.length = 0;
      e.remove();
      await microtask();
      const removed = log.slice();
      document.body.appendChild(e);
      e.start();
      mI += 60000; e.tick();
      const res = { removed: removed, run: noTicks(log).slice(removed.length), status: e.status, time: e.currentTime };
      e.stop();
      e.remove();
      return res;
    };
    P3.idleNeverStarted = await idleCase(async () => {});
    P3.idleStopped = await idleCase(async (e, adv) => { e.start(); adv(); e.stop(); });
    {
      let mI = 0;
      const e = makeEl(DROP);
      e.setClock(() => mI);
      const log = watchAll(e);
      e.start();
      mI += 10000; e.tick();
      log.length = 0;
      e.remove();
      e.program = JSON.parse(JSON.stringify(DROP));  // drops the run, at once
      await microtask();                             // nothing left to drop
      document.body.appendChild(e);
      e.start();
      mI += 60000; e.tick();
      P3.idleReplacedWhileDetached = { log: noTicks(log), status: e.status, time: e.currentTime };
      e.stop();
      e.remove();
    }

    // (h) a dropped run is inert once put back: no method fires anything
    //     for it until stop() (rt-stop only); then start() is a fresh run.
    {
      let mI = 0;
      const e = makeEl(DROP);
      e.setClock(() => mI);
      const log = watchAll(e);
      for (const ev of ['rt-step-start', 'rt-step-complete', 'rt-pause']) {
        e.addEventListener(ev, (x) => log.push([ev, x.detail.stepId, x.detail.time]));
      }
      e.start();
      mI += 60000; e.tick();
      e.remove();
      await microtask();
      document.body.appendChild(e);
      log.length = 0;
      const calls = {
        completeA: e.completeStep('A'),
        completeC: e.completeStep('C'),
        startB: e.startStep('B'),
      };
      e.start(); e.pause(); e.toggle();
      mI += 10000; e.tick();
      P3.inertRunning = { calls: calls, log: log.slice(), status: e.status, time: e.currentTime };
      e.stop();
      P3.inertStop = log.slice(P3.inertRunning.log.length);
      log.length = 0;
      e.start();
      mI += 60000; e.tick();
      P3.inertFresh = { log: noTicks(log), status: e.status, time: e.currentTime };
      e.stop();
      e.remove();
      // Dropped while paused: seek() and start() are ignored as well.
      let mJ = 0;
      const f = makeEl(DROP);
      f.setClock(() => mJ);
      const logF = watchAll(f);
      f.start();
      mJ += 10000; f.tick();
      f.pause();
      f.remove();
      await microtask();
      document.body.appendChild(f);
      logF.length = 0;
      f.seek(500);
      f.start();
      mJ += 10000; f.tick();
      P3.inertPaused = { log: logF.slice(), status: f.status, time: f.currentTime };
      f.stop();
      f.remove();
    }

    // (i) a dropped end is never before its own begin: paused at 60, sought
    //     back to 20, program replaced. C began at 50, so it ends at 50.
    {
      let mI = 0;
      const e = makeEl(DROP);
      e.setClock(() => mI);
      const log = watchAll(e);
      e.start();
      mI += 60000; e.tick();
      e.pause();
      e.seek(20);
      log.length = 0;
      e.program = JSON.parse(JSON.stringify(OTHER));
      P3.droppedAfterSeekBack = log.slice();
      e.remove();
    }

    // (j) an await between remove() and the re-insert is a removal for
    //     good: the run is dropped and the re-inserted element is inert.
    {
      let mI = 0;
      const e = makeEl(DROP);
      e.setClock(() => mI);
      const log = watchAll(e);
      e.start();
      mI += 10000; e.tick();
      log.length = 0;
      e.remove();
      await microtask();
      document.body.appendChild(e);
      mI += 10000; e.tick();
      P3.awaitThenReinsert = { log: log.slice(), status: e.status, time: e.currentTime, timer: e._timer !== null };
      e.stop();
      e.remove();
    }

    // (k) seek() from a handler during a seek: rt-seek events in call
    //     order, each from equal to the previous to.
    {
      const e = makeEl(DROP);
      const log = watchAll(e);
      let once = false;
      e.addEventListener('rt-step-ended', () => { if (!once) { once = true; e.seek(70); } });
      e.seek(60);
      P3.nestedSeek = log.slice();
      e.stop();
      e.remove();
    }

    // ---- translatable labels and accessible buttons (issue #7) ---------
    out.labels = {};
    const buttonInfo = (e, sel) => {
      const b = e.shadowRoot.querySelector(sel);
      if (!b) return null;
      const glyph = b.querySelector('[aria-hidden="true"]');
      return [b.textContent, b.getAttribute('aria-label'), glyph ? glyph.textContent : null];
    };
    let lm = 0;
    const l1 = makeEl(window.RHYLTHYME_EXAMPLES.thanksgiving_one_oven);
    l1.setClock(() => lm);
    out.labels.defaultStart = buttonInfo(l1, '.controls button[data-act="start"]');
    out.labels.defaultStop = buttonInfo(l1, '.controls button[data-act="stop"]');
    out.labels.defaultStatus = l1.shadowRoot.querySelector('.status').textContent;
    out.labels.defaultKeys = Object.keys(l1.labels).length;
    l1.start();
    for (let i = 0; i < 400 && !l1.shadowRoot.querySelector('button[data-step-start]'); i++) { lm += 60000; l1.tick(); }
    out.labels.defaultPause = buttonInfo(l1, '.controls button[data-act="pause"]');
    out.labels.defaultStepStart = buttonInfo(l1, 'button[data-step-start]');
    out.labels.defaultStepDone = buttonInfo(l1, 'button[data-step-done]');
    l1.pause();
    out.labels.defaultResume = buttonInfo(l1, '.controls button[data-act="start"]');
    // Partial French overrides: strings, a {0} placeholder and functions.
    l1.labels = {
      resume: 'Reprendre', stop: 'Arrêter', speed: 'Vitesse', statusPaused: 'en pause',
      startStep: (name) => `Démarrer : ${name}`, doneStep: 'Terminé : {0}',
      actionsHint: '<b>not markup</b>', bogusKey: 'ignored', pause: 42,
    };
    out.labels.frResume = buttonInfo(l1, '.controls button[data-act="start"]');
    out.labels.frStop = buttonInfo(l1, '.controls button[data-act="stop"]');
    out.labels.frStepStart = buttonInfo(l1, 'button[data-step-start]');
    out.labels.frStepDone = buttonInfo(l1, 'button[data-step-done]');
    out.labels.frSpeed = l1.shadowRoot.querySelector('.controls label').firstChild.textContent;
    out.labels.frStatus = [l1.shadowRoot.querySelector('.status').textContent, l1.shadowRoot.querySelector('.status').getAttribute('data-status')];
    out.labels.frHintEscaped = l1.shadowRoot.querySelector('.actions .hint').textContent;
    out.labels.ignoredKeys = [l1.labels.bogusKey === undefined, l1.labels.pause === 'Pause'];
    l1.start();
    out.labels.untranslatedPause = buttonInfo(l1, '.controls button[data-act="pause"]');
    // A function override that throws falls back to English.
    l1.labels = { startStep: () => { throw new Error('boom'); } };
    out.labels.throwingFallsBack = buttonInfo(l1, 'button[data-step-start]')[0].indexOf('▶ Start: ') === 0;
    // null clears every override.

    out.labels.cleared = buttonInfo(l1, '.controls button[data-act="pause"]');
    l1.remove();
    // The factor form.
    const l2 = makeEl(withFactors());
    l2.labels = { factorsTitle: 'Avant de commencer', factorsStart: 'Commencer', factorSkip: '— passer —',
      factorNotNumber: (text) => `« ${text} » n'est pas un nombre` };

    out.labels.formStart = buttonInfo(l2, '.factors button[data-act="factors-start"]');
    out.labels.formSkip = l2.shadowRoot.querySelector('.factors select[data-factor="oven"] option').textContent;
    l2.shadowRoot.querySelector('.factors [data-factor="turkeyKg"]').value = 'lourd';
    l2.shadowRoot.querySelector('.factors button[data-act="factors-start"]').click();
    out.labels.formError = l2.shadowRoot.querySelector('.factors [data-factor-error="turkeyKg"]:not([hidden])').textContent;
    l2.remove();
    const l3 = makeEl(withFactors());
    l3.start();
    out.labels.defaultFormStart = buttonInfo(l3, '.factors button[data-act="factors-start"]');
    l3.remove();
    // The empty state keeps its <code> markup around the translated text.
    const l4 = document.createElement('rhylthyme-timeline');
    document.body.appendChild(l4);
    out.labels.emptyDefault = l4.shadowRoot.querySelector('.empty').innerHTML;
    l4.labels = { noProgram: 'Aucun programme : propriété {0} ou URL {1}.' };
    out.labels.emptyFr = l4.shadowRoot.querySelector('.empty').innerHTML;
    // A function gets the plain words, never internal placeholders.
    l4.labels = { noProgram: (p, a) => 'Kein Programm: ' + String(p).toUpperCase() + ' / ' + a + ' <b>' };
    out.labels.emptyFn = l4.shadowRoot.querySelector('.empty').innerHTML;
    l4.remove();
    // Changing labels while the factor form is open keeps what was typed

    const l5 = makeEl(withFactors());
    l5.start();

    out.labels.typedKept = [kg().value, l5.shadowRoot.querySelector('.factors select[data-factor="oven"]').value,
      l5.shadowRoot.querySelector('.factors h3').textContent];

    l5.shadowRoot.querySelector('.factors button[data-act="factors-start"]').click();
    out.labels.errorBefore = [kgError().textContent, kgError().hidden];
    l5.labels = { factorNotNumber: 'pas un nombre : {0}' };
    out.labels.errorAfter = [kg().value, kgError().textContent, kgError().hidden, l5.status];
    l5.remove();
    // Chart text: unchanged by default, translated keys reach the renderer.
    const chartTexts = (e) => Array.prototype.map.call(e.shadowRoot.querySelectorAll('.chart svg text'), (t) => t.textContent);
    const l6 = makeEl(window.RHYLTHYME_EXAMPLES.thanksgiving_one_oven);
    out.labels.chartDefault = chartTexts(l6);
    const reference = document.createElement('div');
    reference.innerHTML = Rhylthyme.renderTimelineSvg(
      l6._expanded, { timings: l6.timings, now: 0, states: l6.stepStates, width: Math.max(820, l6.clientWidth || 0) });
    out.labels.chartDefaultSame = l6.shadowRoot.querySelector('.chart').innerHTML === reference.innerHTML;
    l6.labels = { chartSubtitle: (tracks, total, seconds) => tracks + ' pistes · ' + total + ' · ' + seconds + ' s',
      legendDependency: 'dépendance', legendManual: 'manuel' };
    out.labels.chartFr = chartTexts(l6);
    l6.remove();
    // Opt-in locale formatting.
    const l7 = makeEl(window.RHYLTHYME_EXAMPLES.thanksgiving_one_oven);
    l7.timeFormat = 'seconds';
    out.labels.loc = { plainSeconds: l7.formatTime(45) };
    l7.timeFormat = 'minutes';
    out.labels.loc.plainMinutes = l7.formatTime(125);
    out.labels.loc.plainSpeed = l7.shadowRoot.querySelector('select[data-set="speed"] option').textContent;
    l7.locale = 'de';
    out.labels.loc.attr = l7.getAttribute('locale');
    out.labels.loc.deMinutes = l7.formatTime(125);
    out.labels.loc.deSpeed = l7.shadowRoot.querySelector('select[data-set="speed"] option').textContent;
    l7.timeFormat = 'seconds';
    out.labels.loc.deSeconds = l7.formatTime(45);
    out.labels.loc.intlSeconds = new Intl.NumberFormat('de', { style: 'unit', unit: 'second', unitDisplay: 'narrow' }).format(45);
    l7.locale = 'ar-EG';
    l7.timeFormat = 'minutes';
    out.labels.loc.arMinutes = l7.formatTime(125);
    l7.locale = 'en-US';
    l7.timeFormat = 'clock';
    l7.startAt = '2026-01-01T13:05:09';
    out.labels.loc.enClock = l7.formatTime(0);
    l7.locale = 'not a locale!!';
    out.labels.loc.badClock = l7.formatTime(0);
    l7.locale = null;
    out.labels.loc.cleared = [l7.hasAttribute('locale'), l7.formatTime(0)];
    l7.remove();

    // The labels attribute: JSON strings, declared before the element
    // upgrades, then changed, broken, removed and mixed with the property.
    const la = out.labels.attr = {};
    const warnings = [];
    const realWarn = console.warn;
    console.warn = (...args) => { warnings.push(args.join(' ')); };
    try {
      const host = document.createElement('div');
      document.body.appendChild(host);
      host.innerHTML = '<rhylthyme-timeline mode="player" locale="de" labels=\'{"stop":"Arrêter","startStep":"Démarrer : {0}","speedOption":"{1} fois","pause":7}\'></rhylthyme-timeline>';
      const a1 = host.firstElementChild;
      la.upgraded = a1.shadowRoot !== null;
      la.declarativeLocale = [a1.locale, a1.formatTime(125)];
      let am = 0;
      a1.setClock(() => am);
      a1.program = JSON.parse(JSON.stringify(window.RHYLTHYME_EXAMPLES.thanksgiving_one_oven));
      la.declStop = buttonInfo(a1, '.controls button[data-act="stop"]');
      la.declSpeed = a1.shadowRoot.querySelector('select[data-set="speed"] option').textContent;
      la.declGetter = [a1.labels.stop, a1.labels.startStep, a1.labels.pause, a1.labels.start];
      a1.start();
      for (let i = 0; i < 400 && !a1.shadowRoot.querySelector('button[data-step-start]'); i++) { am += 60000; a1.tick(); }
      la.declStepStart = buttonInfo(a1, 'button[data-step-start]');
      a1.pause();
      la.warningsAfterDecl = warnings.length;
      // Changing the attribute replaces the table.
      a1.setAttribute('labels', '{"resume":"Reprendre"}');
      la.changedResume = buttonInfo(a1, '.controls button[data-act="start"]');
      la.changedStop = buttonInfo(a1, '.controls button[data-act="stop"]');
      // Invalid JSON (and JSON that is not an object): one warning each,
      // the labels in effect stay.
      a1.setAttribute('labels', '{"resume": Reprendre');
      la.invalidWarnings = warnings.length;
      la.invalidKept = buttonInfo(a1, '.controls button[data-act="start"]');
      a1.setAttribute('labels', '["stop"]');
      la.arrayWarnings = warnings.length;
      la.arrayKept = a1.labels.resume;
      // The property set after the attribute wins, and the getter says so.
      a1.labels = { resume: (x) => 'Weiter' + (x === undefined ? '' : x) };
      la.propertyWins = buttonInfo(a1, '.controls button[data-act="start"]');
      la.propertyAttrUntouched = a1.getAttribute('labels');
      // Removing the attribute leaves labels the property supplied.
      a1.removeAttribute('labels');
      la.removeKeepsProperty = buttonInfo(a1, '.controls button[data-act="start"]');
      // The attribute set after the property wins.
      a1.setAttribute('labels', '{"resume":"Continuer"}');
      la.attributeWins = [buttonInfo(a1, '.controls button[data-act="start"]'), a1.labels.resume];
      // Removing it now clears what it supplied: back to English.
      a1.removeAttribute('labels');
      la.removed = [buttonInfo(a1, '.controls button[data-act="start"]'), a1.labels.resume];
      // An empty attribute is no labels, without a warning.
      a1.setAttribute('labels', '{"stop":"Arrêter"}');
      a1.setAttribute('labels', '');
      la.empty = [buttonInfo(a1, '.controls button[data-act="stop"]'), warnings.length];
      // Writing the attribute again with the value it already has, after the
      // property took over, still takes the table back: last setter wins.
      a1.setAttribute('labels', '{"stop":"AttrStop"}');
      a1.labels = { stop: 'PropStop' };
      a1.setAttribute('labels', '{"stop":"AttrStop"}');
      la.sameValueAfterProperty = [a1.labels.stop, buttonInfo(a1, '.controls button[data-act="stop"]')];
      a1.removeAttribute('labels');
      la.sameValueThenRemoved = a1.labels.stop;
      // An invalid attribute before upgrade: English, one warning.
      host.innerHTML = '<rhylthyme-timeline labels="not json"></rhylthyme-timeline>';
      la.invalidDecl = [host.firstElementChild.labels.stop, warnings.length];
      host.remove();
    } finally {
      console.warn = realWarn;
    }
    la.warnings = warnings;

    // Properties set before the element was defined (see the script before
    // element.js): the class's accessors are not hidden, and the property
    // wins over an attribute that was also there at upgrade.
    const pu = out.labels.preUpgrade = {};
    const P = window.PRE_UPGRADE;
    const prog = () => JSON.parse(JSON.stringify(window.RHYLTHYME_EXAMPLES.thanksgiving_one_oven));
    pu.attachedOwn = [Object.prototype.hasOwnProperty.call(P.attached, 'labels'), Object.prototype.hasOwnProperty.call(P.attached, 'mode')];
    pu.attachedMode = [P.attached.mode, P.attached.getAttribute('mode')];
    P.attached.mode = 'player';
    P.attached.program = prog();
    pu.attachedLabels = [P.attached.labels.stop, P.attached.labels.start, buttonInfo(P.attached, '.controls button[data-act="stop"]')];
    pu.attachedAttrKept = P.attached.getAttribute('labels');
    // The attribute set again afterwards wins as usual.
    P.attached.setAttribute('labels', '{"stop":"AttrStop"}');
    pu.attachedAttrAfter = [P.attached.labels.stop, buttonInfo(P.attached, '.controls button[data-act="stop"]')];
    P.attached.remove();
    pu.detachedBefore = P.detached.shadowRoot === null;
    customElements.upgrade(P.detached);
    pu.detachedOwn = Object.prototype.hasOwnProperty.call(P.detached, 'labels');
    pu.detachedLabels = [P.detached.labels.stop, P.detached._labels.stop];
    customElements.upgrade(P.propOnly);
    pu.propOnly = [Object.prototype.hasOwnProperty.call(P.propOnly, 'labels'), P.propOnly.labels.start, P.propOnly.labels.stop];

    // (d) programVersion parity: the same three programs are hashed in Node
    // with tools/hash-program.js. Base64 so multi-byte characters survive
    // the DOM dump unharmed.
    const b64 = (obj) => btoa(String.fromCharCode.apply(null, new TextEncoder().encode(JSON.stringify(obj))));
    out.hashed = [
      ['thanksgiving_one_oven', window.RHYLTHYME_EXAMPLES.thanksgiving_one_oven],
      ['cookies_three_trays', window.RHYLTHYME_COOKIES],
      ['runrec_demo', RUNREC],
    ].map(([name, program]) => ({ name: name, b64: b64(program), hash: Rhylthyme.programVersion(program) }));

    // Every corpus program renders without throwing
    out.checks.corpusRendered = 0;
    for (const key of Object.keys(window.RHYLTHYME_EXAMPLES)) {
      el.program = JSON.parse(JSON.stringify(window.RHYLTHYME_EXAMPLES[key]));
      if (bars() > 0) out.checks.corpusRendered++;
    }
  } catch (e) {
    out.errors.push(String(e && e.stack || e));
  }
  document.getElementById('results').textContent = JSON.stringify(out);
})();
</script>
