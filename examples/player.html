<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>&lt;rhylthyme-timeline&gt; player demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f3f4f6; color: #111827; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  header h1 { font-size: 16px; margin: 0; }
  header code { font-size: 12px; color: #6b7280; }
  label { font-size: 13px; }
  select { font-size: 13px; padding: 3px 6px; }
  rhylthyme-timeline { max-width: 1100px; border-radius: 12px; padding: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  #log { max-width: 1100px; margin-top: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #374151; white-space: pre-wrap; max-height: 8em; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>&lt;rhylthyme-timeline&gt;</h1>
  <code>@rhylthyme/timeline player</code>
  <label>program <select id="pick"></select></label>
  <label>mode <select id="mode"><option>player</option><option>static</option></select></label>
  <label>theme <select id="theme"><option>light</option><option>dark</option><option>cookbook</option></select></label>
  <label>time <select id="fmt"><option>minutes</option><option>seconds</option><option>hours</option><option>clock</option></select></label>
</header>

<rhylthyme-timeline id="player" mode="player" speed="1" time-format="minutes" theme="light"></rhylthyme-timeline>
<div id="log"></div>

<script src="../src/index.js"></script>
<script src="../src/element.js"></script>
<script src="./programs.js"></script>
<script>
  const el = document.getElementById('player');
  const pick = document.getElementById('pick');
  const log = document.getElementById('log');
  const q = new URLSearchParams(location.search);
  if (q.get('w')) document.body.style.maxWidth = parseInt(q.get('w'), 10) + 'px'; // emulate a narrow viewport for screenshots
  for (const key of Object.keys(window.RHYLTHYME_EXAMPLES)) {
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = window.RHYLTHYME_EXAMPLES[key].name || key;
    pick.appendChild(opt);
  }
  if (q.get('program') && window.RHYLTHYME_EXAMPLES[q.get('program')]) pick.value = q.get('program');
  for (const id of ['mode', 'theme']) if (q.get(id)) document.getElementById(id).value = q.get(id);
  if (q.get('fmt')) document.getElementById('fmt').value = q.get('fmt');

  function apply() {
    el.setAttribute('mode', document.getElementById('mode').value);
    el.setAttribute('theme', document.getElementById('theme').value);
    el.setAttribute('time-format', document.getElementById('fmt').value);
    el.program = JSON.parse(JSON.stringify(window.RHYLTHYME_EXAMPLES[pick.value]));
    // ?at=SECONDS positions the paused player for screenshots; ?start=1 begins playback.
    if (q.get('at')) el.seek(parseFloat(q.get('at')));
    if (q.get('start')) el.start();
  }
  pick.addEventListener('change', apply);
  for (const id of ['mode', 'theme', 'fmt']) document.getElementById(id).addEventListener('change', () => {
    el.setAttribute(id === 'fmt' ? 'time-format' : id, document.getElementById(id).value);
  });
  for (const ev of ['rt-load', 'rt-start', 'rt-pause', 'rt-stop', 'rt-step-start', 'rt-step-complete', 'rt-complete']) {
    el.addEventListener(ev, (e) => {
      const d = Object.assign({}, e.detail); delete d.program;
      log.textContent = ev + ' ' + JSON.stringify(d) + '\n' + log.textContent;
    });
  }
  apply();
</script>
</body>
</html>
